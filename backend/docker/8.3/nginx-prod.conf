server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # رفع حد رفع الملفات (صور KYC + شهادات المعلمين)
    client_max_body_size 20M;

    # ==========================================
    # إخفاء تواقيع السيرفر والترويسرات الأمنية (Security Hardening)
    # ==========================================
    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header X-Pingback;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://fonts.bunny.net https://ui-avatars.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # معالجة طلبات Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # تمرير PHP لـ FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # حماية الملفات الحساسة
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # تحسين تحميل الملفات الثابتة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    access_log /var/log/nginx/taj-access.log;
    error_log  /var/log/nginx/taj-error.log;
}
